name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src/imeeting tests
      - name: Test
        run: python -m pytest -q
      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip-audit
          python -m pip_audit --local --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Dependency audit
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          docker compose \
            --env-file deploy/production.env.example \
            -f deploy/compose.yaml \
            config
          docker compose \
            --env-file deploy/production.env.example \
            -f deploy/compose.yaml \
            --profile tls config
      - name: Validate deployment scripts
        run: |
          sh -n deploy/backup_sqlite.sh
          sh -n deploy/restore_sqlite.sh
          docker run --rm \
            -v "$PWD/deploy/prometheus-alerts.yml:/rules.yml:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.55.1 \
            check rules /rules.yml
          docker build --check -f deploy/backend.Dockerfile .
          docker run --rm \
            -e SITE_ADDRESS=localhost \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build frontend image
        run: docker build -f deploy/frontend.Dockerfile -t imeeting-frontend:ci .
      - name: Scan frontend image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e TRIVY_CACHE_DIR=/tmp/trivy \
            aquasec/trivy:0.59.1 image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            imeeting-frontend:ci
      - name: Generate frontend SBOM
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            -e TRIVY_CACHE_DIR=/tmp/trivy \
            aquasec/trivy:0.59.1 image \
            --scanners vuln \
            --exit-code 0 \
            --format cyclonedx \
            --output /work/imeeting-frontend.cdx.json \
            imeeting-frontend:ci
      - uses: actions/upload-artifact@v4
        with:
          name: imeeting-frontend-sbom
          path: imeeting-frontend.cdx.json
          if-no-files-found: error

