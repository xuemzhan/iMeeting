<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="iMeeting">
  <defs>
    <linearGradient id="imeeting-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1f1f" />
      <stop offset="100%" stop-color="#b81f1f" />
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect width="32" height="32" rx="9" fill="url(#imeeting-bg)" />

  <!-- 抽象信号弧：形似 C，示意「电子 / 连接」 -->
  <path
    d="M22.8 8 A10.5 10.5 0 0 1 22.8 24"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.7"
    stroke-linecap="round"
    opacity="0.45"
  />

  <!-- 中心芯片：示意「科技 / 智能」 -->
  <rect x="11" y="11" width="10" height="10" rx="3" fill="#ffffff" />
  <rect x="14" y="14" width="4" height="4" rx="1.2" fill="#d92b2b" />

  <!-- 电路引脚 -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round">
    <path d="M16 11V7.6" />
    <path d="M16 21v3.4" />
    <path d="M11 16H7.6" />
    <path d="M21 16h3.4" />
  </g>
</svg>
