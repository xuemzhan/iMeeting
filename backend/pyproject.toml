[project]
name = "imeeting"
version = "0.1.0"
description = "iMeeting - real-time meeting transcription and intelligent minutes"
readme = "README.md"
# 3.10 装不上：安全底线 constraints-production.txt 要求 pillow>=13，而 Pillow 13
# 的 requires-python 是 >=3.11（无 cp310 wheel）。因此声明的最低版本必须同步抬高，
# 否则 CI 的 3.10 门禁在 pip 安装阶段就死，等于没有门禁。
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "python-multipart>=0.0.9",
    "orjson>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pyjwt>=2.9",
    # 直接使用 bcrypt，不用 passlib：passlib 1.7.4 与 bcrypt>=4.1 不兼容
    # （其后端自检会用 >72 字节口令触发 ValueError，导致启动即崩溃）
    "bcrypt>=4.1",
    "cryptography>=43",
    "httpx>=0.27",
    "numpy>=1.26",
    "soundfile>=0.12",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
asr = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "funasr>=1.4",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "psutil>=5.9",
    "websockets>=12",
    "pytest-cov>=5",
    # pypdf 只用于 X-2 的"中文 PDF 真能读出来"门禁：断言不是看魔数，
    # 而是把导出的 PDF 重新解析、比对中文文本（Helvetica 回退时抽不出这些字）。
    "pypdf>=5",
]

[project.scripts]
imeeting = "imeeting.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["imeeting*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Keep CI focused on syntax errors, undefined names and import ordering.
# The legacy model code still uses a large number of Optional[...] and
# FastAPI Depends(...) defaults, so style-only modernization rules would
# create a noisy refactor unrelated to this release.
#
# IM-PLN-004 §5.7：新增 B（bugbear）与 ASYNC。ASYNC 正是 C-3 那类
# "async 函数里直接做同步阻塞调用"的静态抓手；B008 在此忽略是因为
# `Depends()`/`Query()` 作为默认参数值是 FastAPI 的既定写法
# （启用前存量 217 处，全部属这一类）。
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# 过滤第三方库的噪音警告（torch/FunASR 的 distutils 废弃告警会淹没真实问题）
filterwarnings = [
    "ignore::DeprecationWarning:funasr.*",
    "ignore::SyntaxWarning:funasr.*",
    "ignore::UserWarning:funasr.*",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::DeprecationWarning:jieba.*",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
# 只统计业务包；tests/ 与 migrations/ 不计入，避免「覆盖率自我循环」。
source = ["imeeting"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
