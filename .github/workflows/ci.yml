name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check imeeting tests
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Install Linux native tooling
        run: |
          npm install --no-save --no-package-lock \
            "@rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")" \
            "@esbuild/linux-x64@$(node -p "require('esbuild/package.json').version")"
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

