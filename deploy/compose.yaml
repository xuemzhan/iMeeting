name: imeeting

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_URL: sqlite:////data/meeting.db
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/production.env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in deploy/production.env}
      REQUIRE_AUTH: "1"
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      LOG_JSON: "1"
      LOG_FILE: /data/logs/backend.log
      FUNASR_DEVICE: ${FUNASR_DEVICE:-cpu}
      FUNASR_NCPU: ${FUNASR_NCPU:-4}
      MAX_CONCURRENT_SESSIONS: ${MAX_CONCURRENT_SESSIONS:-4}
      JOB_HEAVY_WORKERS: ${JOB_HEAVY_WORKERS:-1}
      JOB_LIGHT_WORKERS: ${JOB_LIGHT_WORKERS:-2}
      ASR_MODE: ${ASR_MODE:-normal}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - imeeting-data:/data
      - imeeting-models:/models
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/live"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    environment:
      BACKEND_UPSTREAM: backend:8000

  tls:
    image: caddy:2.8-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - imeeting-caddy-data:/data
      - imeeting-caddy-config:/config

volumes:
  imeeting-data:
  imeeting-models:
  imeeting-caddy-data:
  imeeting-caddy-config:
