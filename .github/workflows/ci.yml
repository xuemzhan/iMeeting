name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    # X-1（IM-PLN-004）：Windows 与 Linux 都要跑。
    # 目的不是"多跑一遍"，而是让"Windows 适配"这件事有强制门禁——
    # 上一版方案里它是纯人工承诺，回归没人会发现。
    name: backend (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          # requires-python 声明的是 >=3.11（Pillow 13 的下限），最低版本也要有门禁。
          # 3.10 已被安全底线排除：pillow>=13 在 3.10 上没有可分发的 wheel。
          - os: ubuntu-latest
            python: "3.11"
    defaults:
      run:
        working-directory: backend
    env:
      # 测试不加载模型：与 README 的自测口径一致
      ASR_MODE: echo
      SKIP_MODEL_WARMUP: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-production.txt -e ".[dev]"
      - name: Lint
        run: python -m ruff check src/imeeting tests
      - name: Test with coverage
        run: python -m pytest -q --cov=imeeting --cov-report=json:coverage.json
      - name: Coverage ratchet (fails only when coverage drops)
        # 棘轮只在基准平台（ubuntu 3.12）上生效，避免跨平台覆盖率差异误伤
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/coverage_ratchet.py
      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip-audit
          python -m pip_audit --local --skip-editable

  frontend:
    # X-1：Windows 上跑一遍前端四项检查——它能直接暴露路径大小写、换行符、
    # 脚本里 shell 方言这类"只在 Windows 出错"的问题。
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: pcm-worklet must match its single source
        run: npm run worklet:check
      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Coverage ratchet (fails only when coverage drops)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run test:coverage
          npm run coverage:check
      - name: Typecheck
        run: npm run typecheck
        # 注意：一个 step 只能有一个 run:。这里曾重复写了两行，
        # 导致整个工作流在 GitHub 侧解析失败（'run' is already defined），
        # 结果是 CI 连着两个提交都是 0 秒失败——门禁形同不存在。
      - name: Build
        run: npm run build
      - name: Install Chromium for the responsive gate
        run: npx playwright install --with-deps chromium
      - name: Responsive gate (no horizontal overflow / tap targets >= 40 / single CTA)
        # 这段是 bash 写法（后台作业 + seq + curl 轮询）。Windows runner 默认 shell 是
        # PowerShell，同一段脚本会在第一行就 ParserError——首跑实测如此。
        # 显式指定 bash：Windows runner 自带 Git Bash，两平台共用一份脚本。
        shell: bash
        env:
          CI: '1'
        run: |
          npx vite preview --port 5173 --strictPort &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173 >/dev/null && break
            sleep 1
          done
          npm run verify:responsive

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-production.txt -e ".[dev]"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          docker compose \
            --env-file deploy/production.env.example \
            -f deploy/compose.yaml \
            config
          docker compose \
            --env-file deploy/production.env.example \
            -f deploy/compose.yaml \
            --profile tls config
      - name: Validate deployment scripts
        run: |
          sh -n deploy/backup_sqlite.sh
          sh -n deploy/restore_sqlite.sh
          docker run --rm \
            -v "$PWD/deploy/prometheus-alerts.yml:/rules.yml:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.55.1 \
            check rules /rules.yml
          docker build --check -f deploy/backend.Dockerfile .
          docker run --rm \
            -e SITE_ADDRESS=localhost \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build frontend image
        run: docker build -f deploy/frontend.Dockerfile -t imeeting-frontend:ci .
      - name: Scan frontend image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e TRIVY_CACHE_DIR=/tmp/trivy \
            aquasec/trivy:0.59.1 image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            imeeting-frontend:ci
      - name: Generate frontend SBOM
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            -e TRIVY_CACHE_DIR=/tmp/trivy \
            aquasec/trivy:0.59.1 image \
            --scanners vuln \
            --exit-code 0 \
            --format cyclonedx \
            --output /work/imeeting-frontend.cdx.json \
            imeeting-frontend:ci
      - uses: actions/upload-artifact@v4
        with:
          name: imeeting-frontend-sbom
          path: imeeting-frontend.cdx.json
          if-no-files-found: error

