[project]
name = "imeeting"
version = "0.1.0"
description = "iMeeting - real-time meeting transcription and intelligent minutes"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "python-multipart>=0.0.9",
    "orjson>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pyjwt>=2.9",
    # 直接使用 bcrypt，不用 passlib：passlib 1.7.4 与 bcrypt>=4.1 不兼容
    # （其后端自检会用 >72 字节口令触发 ValueError，导致启动即崩溃）
    "bcrypt>=4.1",
    "cryptography>=43",
    "httpx>=0.27",
    "numpy>=1.26",
    "soundfile>=0.12",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
asr = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "funasr>=1.4",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "psutil>=5.9",
    "websockets>=12",
]

[project.scripts]
imeeting = "imeeting.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["imeeting*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Keep CI focused on syntax errors, undefined names and import ordering.
# The legacy model code still uses a large number of Optional[...] and
# FastAPI Depends(...) defaults, so style-only modernization rules would
# create a noisy refactor unrelated to this release.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# 过滤第三方库的噪音警告（torch/FunASR 的 distutils 废弃告警会淹没真实问题）
filterwarnings = [
    "ignore::DeprecationWarning:funasr.*",
    "ignore::SyntaxWarning:funasr.*",
    "ignore::UserWarning:funasr.*",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::DeprecationWarning:jieba.*",
]
addopts = "-ra --strict-markers"
